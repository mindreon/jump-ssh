# Example only. Replace endpoints/accounts before use; never distribute config.yaml.
jumpserver:
  host: "jump.example.com" # JumpServer SSH gateway, not its web URL
  port: 2222 # Change to the gateway SSH port configured by your administrator
  user: "your-jumpserver-user"

  # Mode A: public-key/passwordless login. Public key must be authorized in JumpServer.
  auth_mode: "key"
  # private_key: "~/.ssh/id_ed25519" # Optional; otherwise discover keys/use SSH Agent
  # key_passphrase_env: "JUMP_SSH_KEY_PASSPHRASE" # Only for an encrypted private key
  allow_agent: true
  look_for_keys: true

  # Mode B: replace auth_mode above with "password" and enable ONE of these:
  # password_env: "JUMP_SSH_PASSWORD" # Read from the current process environment
  # password: "replace-locally" # Local-only alternative; never publish this value

  # Optional; default ~/.ssh/known_hosts. Non-default ports use [host]:port entries.
  # known_hosts: "~/.ssh/known_hosts"

allowed_hosts:
  - name: "dev-1" # CLI --host alias, unique ignoring case
    ip: "192.0.2.10" # Documentation address: replace with asset address in JumpServer
    user: "deploy" # Authorized target-system account, NOT the JumpServer username
    # default_workdir: "/opt/app" # Optional; must exist on target; ~/app is supported
    # selector: "asset-identifier" # Optional menu compatibility mode; see reference

timeout:
  connect: 15 # TCP connection phase, seconds
  expect: 15 # Each SSH handshake/auth/channel/prompt phase, seconds
  command: 60 # Each remote command wait, seconds; timeout does not prove cancellation
  idle: 900 # Inactive persistent-session lifetime, seconds (POSIX only)
